# Tự build bản tĩnh và cập nhật nhánh gh-pages mỗi khi push lên main.
# GitHub Pages của repo phục vụ từ nhánh gh-pages (Settings → Pages → Deploy from a branch).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Repo dạng <user>.github.io phục vụ ở gốc tên miền; repo khác cần basePath "/<tên-repo>".
      - name: Build static site
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: ${{ endsWith(github.event.repository.name, '.github.io') && '' || format('/{0}', github.event.repository.name) }}
      - name: Publish to gh-pages branch
        run: |
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
